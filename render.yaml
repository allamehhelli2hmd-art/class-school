services:
  - type: web
    name: class-school
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_INITIAL_PASSWORD
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: class-school-db
          property: connectionString

databases:
  - name: class-school-db
    plan: free
